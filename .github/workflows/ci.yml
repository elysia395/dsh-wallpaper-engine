name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Build client bundle
        run: npm run build
      - name: Verify client bundle contract
        run: npm run verify
      - name: Verify scene extraction + routes
        run: node scripts/verify-scene.mjs
