name: auto-merge-mac

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - dsh-wallpaper-engine-mac

permissions:
  pull-requests: write
  contents: write

jobs:
  enable-automerge:
    if: ${{ github.event.pull_request.base.ref == 'dsh-wallpaper-engine-mac' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for mac PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --auto \
            --squash
