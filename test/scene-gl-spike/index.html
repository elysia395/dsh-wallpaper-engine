<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>scene-gl spike</title>
<style>
  body { margin: 0; background: #222; }
  #glcanvas { display: block; width: 960px; height: 540px; }
  /* 冻结归因实验: ?glass=1 时叠加 liquid-glass 面板 (配方复刻 client.js:3888-3890) */
  .glass-panel {
    position: fixed; pointer-events: none; z-index: 10;
    border-radius: 18px;
    -webkit-backdrop-filter: blur(16px) saturate(1.8);
    backdrop-filter: blur(16px) saturate(1.8);
    background: rgba(20, 24, 32, 0.42);
    border: 1px solid rgba(255, 255, 255, 0.18);
  }
  #glass1 { left: 40px; top: 60px; width: 280px; height: 180px; }
  #glass2 { right: 60px; top: 200px; width: 340px; height: 220px; }
  #glass3 { left: 300px; bottom: 50px; width: 420px; height: 140px; }
  #hud { position: fixed; left: 8px; bottom: 8px; color: #0f0; font: 12px monospace; z-index: 20;
         background: rgba(0,0,0,.5); padding: 2px 6px; white-space: pre; }
</style>
</head>
<body>
<canvas id="glcanvas" width="960" height="540"></canvas>
<div id="glass1" class="glass-panel" hidden></div>
<div id="glass2" class="glass-panel" hidden></div>
<div id="glass3" class="glass-panel" hidden></div>
<div id="hud"></div>
<script type="module" src="./spike.mjs"></script>
</body>
</html>
