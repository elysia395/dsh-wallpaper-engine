</style><body data-we-glass-page data-we-glass-chat data-we-left-sidebar data-we-glass-window><div data-composer-card>输入框／圆角折射</div><div class="we-picker">弹层／薄边高光</div><div data-chat-flow data-slot="conversation.view"><div class="md-code-block" id="fence"><pre><code>console.log('unchanged');</code></pre></div><div class="demo_bubble" id="bubble">用户消息<div class="md-code-block" id="nested">nested code</div></div><div class="demo_bubble" role="tooltip" id="tooltip">tooltip</div><p><code class="capsule" id="inlineA">appParam</code> <code class="capsule" id="inlineB">LiveKernelReports</code></p><button class="demo_toBottom" id="bottom">↓</button></div><div id="sidebarHost" data-we-surface-runtime="left-sidebar"><div data-slot="sidebar"></div></div>

<pre id="result">RUNNING</pre><script>
// Match the real bundle's lexical shadowing instead of testing in an empty scope.
const CSS = 'plugin stylesheet';
const selection={glassOptics:true};let glassRowDisabled=false,skinYieldState=false;const skinYieldActive=()=>skinYieldState;
const apiUrl=p=>p;
window.fetch=async(url,opts)=>{if(opts?.body){const row=JSON.parse(opts.body);diagnostics.push(row)}return {ok:true}};
const diagnostics=[];function reportClientDiag(event,detail){diagnostics.push({event,detail})}
/* OPTICS_SOURCE */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const next=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
async function waitFor(predicate) {
 const deadline=performance.now()+5000;
 while(!predicate() && performance.now()<deadline) await sleep(25);
 return predicate();
}
async function movePointer(x,y) {
 const optics=window.__weGlassOptics,previousWrites=optics.lightWrites;
 document.dispatchEvent(new PointerEvent('pointermove',{clientX:x,clientY:y,pointerType:'mouse'}));
 if(!await waitFor(()=>optics.lightWrites>previousWrites)) throw new Error(`No glass light update for pointer at (${x},${y})`);
}
const assertions=[];function check(value,message){if(!value)throw new Error(message);assertions.push(message)}
(async()=>{
 const el=document.querySelector('[data-composer-card]'),picker=document.querySelector('.we-picker');
 const originalPosition=getComputedStyle(el).position;
 const fence=document.getElementById('fence'),bubble=document.getElementById('bubble');
 const originalCode=fence.innerHTML;
 const native=getComputedStyle(el,'::before').backdropFilter;
 const release=installGlassOptics();
 // The compositor publishes visible maps over several frames.
 await waitFor(()=>window.__weGlassOptics?.maps>=10);
 const optics=window.__weGlassOptics;
 check(optics?.surfaces===10,'Composer, panel, fence, bubble, inline capsules and bottom button found');
 check(optics.maps===10,`All visible rounded displacement maps published (${optics.maps}/10)`);
 check(getComputedStyle(el,'::before').backdropFilter.includes('url('),'Pseudo-element carries refraction');
 check(getComputedStyle(picker).backdropFilter.includes('url('),'Direct glass carries refraction');
 check(getComputedStyle(fence).backdropFilter.includes('url(')&&getComputedStyle(bubble).backdropFilter.includes('url('),'Code fences and user bubbles carry actual refraction');
 check(getComputedStyle(fence).backgroundImage.includes('radial-gradient'),'Tracking glow outranks upstream important background shorthand');
 check(getComputedStyle(fence).outlineStyle==='solid','Code rim remains visible over child backgrounds');
 check(fence.innerHTML===originalCode,'Code content and copy markup unchanged');
 check(!document.getElementById('tooltip').hasAttribute('data-we-optics'),'Host tooltip excluded');
 check(!document.getElementById('nested').hasAttribute('data-we-optics'),'Nested code avoids double refraction');
 check(getComputedStyle(document.querySelector('[data-we-optics-root] [data-we-optics-seat="'+document.getElementById('inlineA').getAttribute('data-we-optics-seat')+'"]')).backdropFilter.includes('url('),'Inline code capsule carries refraction');
 check(getComputedStyle(document.getElementById('bottom')).backdropFilter.includes('url('),'Jump-to-bottom button carries refraction');
 check(window.__weGlassOptics.cacheHits>0,'Equal-sized capsules share a displacement filter');
 check(getComputedStyle(el).position===originalPosition && getComputedStyle(el).backdropFilter==='none','Composer containing block unchanged');
 check(getComputedStyle(el,'::before').backdropFilter.includes('saturate(1.5)'),'Native material filter retained');
 await movePointer(550,125);
 check(parseFloat(getComputedStyle(el).getPropertyValue('--we-optics-x'))>el.offsetWidth,'Pointer follows beyond card boundary');
 let observedStyleMutations=0;
 const styleObserver=new MutationObserver(records=>observedStyleMutations+=records.length);
 styleObserver.observe(document.body,{subtree:true,attributes:true,attributeFilter:['style']});
 const reads=window.__weGlassOptics.layoutReads,scans=window.__weGlassOptics.scans,updates=window.__weGlassOptics.updates;
 for(let i=0;i<6;i++) await movePointer(555+i,125);
 check(window.__weGlassOptics.layoutReads===reads,'Steady pointer tracking performs zero layout reads');
 check(window.__weGlassOptics.scans===scans&&window.__weGlassOptics.updates===updates,'Pointer tracking performs no DOM discovery or map rebuild');
 check(observedStyleMutations===0,'CSSOM pointer updates do not trigger upstream style MutationObserver');styleObserver.disconnect();
 check(getComputedStyle(document.getElementById('plate')).backdropFilter.includes('url('),'Upstream sidebar decoration leaf carries refraction');
 check(!document.getElementById('sidebarHost').hasAttribute('data-we-optics'),'Upstream sidebar host remains untouched');
 check(getComputedStyle(document.getElementById('settings')).backdropFilter==='none'&&getComputedStyle(document.getElementById('settings'),'::before').backdropFilter.includes('url('),'Settings filter remains on upstream pseudo leaf');
 check(!document.getElementById('preserved').hasAttribute('data-we-optics'),'Native preserve policy remains effective');
 check(getComputedStyle(document.getElementById('versions')).backdropFilter.includes('url('),'Plugin version panel gains refraction');
 check(document.getElementById('inlineA').getAttribute('data-we-optics')==='compact','Single-line text capsules use the deeper compact profile');
 const capsule=document.getElementById('inlineA'),leaf=document.querySelector('[data-we-optics-root] [data-we-optics-seat="'+capsule.getAttribute('data-we-optics-seat')+'"]');
 check(getComputedStyle(leaf).backdropFilter.includes('blur(0.35px)'),'Compact lens is not washed out by the original 10px frost');
 check(getComputedStyle(capsule).position==='static'&&getComputedStyle(capsule).backdropFilter==='none','Glyphs and containing block remain outside the refraction layer');
 check(Math.abs(leaf.getBoundingClientRect().left-capsule.getBoundingClientRect().left)<1,'Independent leaf follows capsule geometry');
 window.dispatchEvent(new Event('resize'));await sleep(50);await next();
 check(window.__weGlassOptics.layoutReads>reads,'Viewport resize invalidates cached pointer coordinates');
 const oldMaps=window.__weGlassOptics.updates;el.style.width='510px';await sleep(200);await next();
 check(window.__weGlassOptics.updates>oldMaps,'Resize rebuilds geometry');
 document.body.removeAttribute('data-we-glass-chat');await sleep(200);await next();
 check(!el.hasAttribute('data-we-optics'),'Native glass toggle releases enhancement');
 document.body.setAttribute('data-we-thinking-native','');await sleep(200);await next();
 check(!fence.hasAttribute('data-we-optics')&&!bubble.hasAttribute('data-we-optics'),'Native conversation mode opts out');
 document.body.removeAttribute('data-we-thinking-native');document.body.setAttribute('data-we-glass-chat','');await sleep(200);await next();
 const dynamic=document.createElement('div');dynamic.className='md-code-block';dynamic.textContent='streamed code';document.querySelector('[data-chat-flow]').prepend(dynamic);await sleep(250);await next();
 check(dynamic.hasAttribute('data-we-optics')&&getComputedStyle(dynamic).backdropFilter.includes('url('),'New streamed code is enhanced');
 dynamic.style.position='fixed';dynamic.style.top='1200px';await sleep(200);await next();
 check(!dynamic.hasAttribute('data-we-optics'),'Offscreen surfaces release enhanced compositor filters');
 dynamic.style.top='120px';await sleep(200);await next();
 check(dynamic.hasAttribute('data-we-optics')&&getComputedStyle(dynamic).backdropFilter.includes('url('),'Returning surfaces restore refraction from cache');
 dynamic.remove();await sleep(150);await next();
 release();check(!document.querySelector('[data-we-optics],style[data-dsh-local-lens]'),'Dispose removes optics');
 check(getComputedStyle(el,'::before').backdropFilter===native,'Original native material restored');
 document.body.setAttribute('data-we-glass-chat','');
 syncGlassOptics();await sleep(350);await next();check(!!window.__weGlassOptics,'Native glass sync mounts optics');
 glassRowDisabled=true;disposeGlassOptics();check(!window.__weGlassOptics&&!document.querySelector('[data-we-optics]'),'Native glass dispose removes optics');
 glassRowDisabled=false;syncGlassOptics();await sleep(350);await next();check(!!window.__weGlassOptics,'Re-enabling native glass restores optics');
 const wrapped=document.createElement('div');wrapped.style.cssText='position:fixed;left:700px;top:250px;width:65px;word-break:break-all';wrapped.innerHTML='<code id="wrappedCode">LongInlineCodeThatWrapsAcrossSeveralLines</code>';document.querySelector('[data-chat-flow]').append(wrapped);await sleep(250);await next();
 check(document.getElementById('wrappedCode').getClientRects().length>1&&!getComputedStyle(document.getElementById('wrappedCode')).backdropFilter.includes('url('),'Wrapping code keeps native line boxes without a rectangular refraction overlay');wrapped.remove();
 skinYieldState=true;syncGlassOptics();check(!window.__weGlassOptics,'Native skin-yield function pauses optics');
 skinYieldState=false;syncGlassOptics();await sleep(350);await next();check(!!window.__weGlassOptics,'Leaving skin-yield restores optics');disposeGlassOptics();
 const getContext=HTMLCanvasElement.prototype.getContext;
 HTMLCanvasElement.prototype.getContext=()=>{throw new Error('Injected map failure')};
 installGlassOptics();await sleep(200);await next();
 check(!document.querySelector('[data-we-optics]'),'Asynchronous map failure rolls back all surfaces');

 HTMLCanvasElement.prototype.getContext=getContext;
 document.getElementById('result').textContent=JSON.stringify({ok:true,assertions,diagnostics});
})().catch(e=>document.getElementById('result').textContent=JSON.stringify({ok:false,error:e.stack,assertions,diagnostics}));
</script>
