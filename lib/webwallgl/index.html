<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!--
      移动端 WebView 默认按 980px 宽的桌面视口排版，再整体缩放到屏宽；锁定 viewport
      到设备宽度，画布才等于真实屏幕。桌面宿主没有 viewport 概念，这个标签对它无副作用。
    -->
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title>WebWallGL Renderer</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #wp {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      #wp > iframe.we-fallback {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        background: transparent;
      }
    </style>
    <!--
      引擎用自包含的全局版（已内联 mediabunny）：ESM 版对 mediabunny 是裸导入，浏览器无法直接解析。
      经典脚本先于 module 脚本执行，renderer.js 运行时 window.WebWallGL 已就绪。
    -->
    <script src="./engine/webwallgl.global.min.js"></script>
    <script type="module" src="./renderer.js"></script>
  </head>
  <body>
    <div id="wp"></div>
  </body>
</html>
